name: WooCommerce acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/woocommerce-acceptance.yml'
      - 'new-torantejarat/**'
      - 'tests/acceptance/new-torantejarat/**'

permissions:
  contents: read

concurrency:
  group: woocommerce-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_ROOT: /tmp/torantejarat-wp
      BASE_URL: http://127.0.0.1:8080
      FIXTURE_FILE: /tmp/torantejarat-fixture.json
      TEST_RESULTS_DIR: /tmp/torantejarat-test-results
      # Disposable identities on an ephemeral runner only; never reuse these.
      CI_ADMIN_PASSWORD: ci-admin-only-2026
      CI_CUSTOMER_PASSWORD: ci-customer-only-2026
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, gd, intl, mbstring, mysqli, xml, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/acceptance/new-torantejarat/package-lock.json

      - name: Lint theme and acceptance PHP/JavaScript
        run: |
          set -euo pipefail
          find new-torantejarat tests/acceptance/new-torantejarat -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find new-torantejarat -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tests/acceptance/new-torantejarat/browser-smoke.mjs

      - name: Install WP-CLI
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          wp --info

      - name: Install isolated WordPress
        run: |
          set -euo pipefail
          mkdir -p "$WP_ROOT"
          wp core download --path="$WP_ROOT" --version=7.1.3 --locale=en_US
          wp config create --path="$WP_ROOT" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check --extra-php <<'PHP'
          define( 'WP_ENVIRONMENT_TYPE', 'development' );
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_DEBUG_DISPLAY', false );
          define( 'WP_MEMORY_LIMIT', '256M' );
          define( 'DISABLE_WP_CRON', true );
          define( 'AUTOMATIC_UPDATER_DISABLED', true );
          PHP
          for attempt in {1..30}; do
            if wp db check --path="$WP_ROOT"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done
          wp core install --path="$WP_ROOT" --url="$BASE_URL" --title='ToranTejarat CI' --admin_user=ci_admin --admin_password="$CI_ADMIN_PASSWORD" --admin_email=ci-admin@example.test --skip-email
          wp option update blog_public 0 --path="$WP_ROOT"
          wp option update timezone_string Asia/Tehran --path="$WP_ROOT"
          wp rewrite structure '/%postname%/' --path="$WP_ROOT"

      - name: Activate WooCommerce and the branch theme
        run: |
          set -euo pipefail
          wp plugin install woocommerce --version=11.2.1 --activate --path="$WP_ROOT"
          cp -a "$GITHUB_WORKSPACE/new-torantejarat" "$WP_ROOT/wp-content/themes/new-torantejarat"
          wp theme activate new-torantejarat --path="$WP_ROOT"
          wp eval-file "$GITHUB_WORKSPACE/tests/acceptance/new-torantejarat/setup-fixture.php" --path="$WP_ROOT"

      - name: Install Playwright Chromium
        working-directory: tests/acceptance/new-torantejarat
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start the disposable WordPress server
        run: |
          set -euo pipefail
          nohup php -S 127.0.0.1:8080 -t "$WP_ROOT" "$GITHUB_WORKSPACE/tests/acceptance/new-torantejarat/router.php" >/tmp/torantejarat-wp-server.log 2>&1 &
          echo $! >/tmp/torantejarat-wp-server.pid
          for attempt in {1..30}; do
            if curl -fsS "$BASE_URL/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -100 /tmp/torantejarat-wp-server.log
          exit 1

      - name: Run real WooCommerce browser acceptance
        working-directory: tests/acceptance/new-torantejarat
        run: node browser-smoke.mjs

      - name: Fail on PHP fatals in the WordPress debug log
        run: |
          set -euo pipefail
          if [ -f "$WP_ROOT/wp-content/debug.log" ] && grep -E 'PHP Fatal error|PHP Parse error|Uncaught (Error|Exception)' "$WP_ROOT/wp-content/debug.log"; then
            tail -120 "$WP_ROOT/wp-content/debug.log"
            exit 1
          fi

      - name: Print diagnostics after a failure
        if: failure()
        run: |
          echo '--- PHP built-in server log ---'
          tail -160 /tmp/torantejarat-wp-server.log 2>/dev/null || true
          echo '--- WordPress debug log ---'
          tail -160 "$WP_ROOT/wp-content/debug.log" 2>/dev/null || true
          echo '--- Fixture metadata (no passwords) ---'
          cat "$FIXTURE_FILE" 2>/dev/null || true

      - name: Upload browser and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woocommerce-acceptance-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            /tmp/torantejarat-test-results/
            /tmp/torantejarat-wp-server.log
            /tmp/torantejarat-wp/wp-content/debug.log
